[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zkauth-client"
version = "0.1.0"
description = "Python SDK for ZKAuth"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["requests", "pyjwt[crypto]>=2.8"]

[tool.setuptools.packages.find]
where = ["."]
